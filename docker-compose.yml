# docker-compose.yml for jeetSocial
# Defines web and db services, healthchecks, and environment setup.
# See README.md for usage and troubleshooting.

services:
  web:
    build: .
    command: python3 run_socketio.py
    network_mode: host
    volumes:
      - .:/app  # Mount current code into container
    env_file:
      - .env
    environment:
      - USE_SOCKETIO=true
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5678/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  db:
    image: postgres:15
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: jeetsocial
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
