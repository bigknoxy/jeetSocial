<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Frontend Test</title>
</head>
<body>
    <h1>WebSocket Frontend Integration Test</h1>
    <div id="status">Loading modules...</div>
    <div id="logs"></div>
    
    <!-- Load module bootstrap -->
    <script type="module" src="/static/dist/module-bootstrap.js"></script>
    
    <script>
        // Test if modules are loaded
        setTimeout(() => {
            const status = document.getElementById('status');
            const logs = document.getElementById('logs');
            
            const results = {
                'WebSocketService': typeof window.WebSocketService !== 'undefined',
                'wsService': typeof window.wsService !== 'undefined',
                'ApiService': typeof window.ApiService !== 'undefined',
                'apiService': typeof window.apiService !== 'undefined',
                'Store': typeof window.Store !== 'undefined',
                'store': typeof window.store !== 'undefined',
                'FeedManager': typeof window.FeedManager !== 'undefined',
                'feedManager': typeof window.feedManager !== 'undefined',
                'KindnessManager': typeof window.KindnessManager !== 'undefined'
            };
            
            status.innerHTML = 'Module Loading Results:';
            
            for (const [module, loaded] of Object.entries(results)) {
                const div = document.createElement('div');
                div.style.color = loaded ? 'green' : 'red';
                div.textContent = `${module}: ${loaded ? 'LOADED' : 'NOT LOADED'}`;
                logs.appendChild(div);
            }
            
            // Test WebSocket connection if available
            if (window.wsService) {
                const wsDiv = document.createElement('div');
                wsDiv.innerHTML = 'Testing WebSocket connection...';
                logs.appendChild(wsDiv);
                
                window.wsService.connect().then(() => {
                    wsDiv.style.color = 'green';
                    wsDiv.textContent = 'WebSocket: CONNECTED';
                }).catch(err => {
                    wsDiv.style.color = 'red';
                    wsDiv.textContent = `WebSocket: FAILED - ${err.message}`;
                });
            }
        }, 2000); // Wait 2 seconds for modules to load
    </script>
</body>
</html>
