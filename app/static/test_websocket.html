<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Test</title>
</head>
<body>
    <h1>WebSocket Connection Test</h1>
    <div id="status">Connecting...</div>
    <div id="messages"></div>
    
    <script src="/static/socket.io.min.js"></script>
    <script>
        const statusDiv = document.getElementById('status');
        const messagesDiv = document.getElementById('messages');
        
        function log(msg) {
            console.log(msg);
            messagesDiv.innerHTML += '<p>' + new Date().toLocaleTimeString() + ': ' + msg + '</p>';
        }
        
        log('Attempting to connect to WebSocket...');
        
        const socket = io('/', {
            transports: ['websocket', 'polling']
        });
        
        socket.on('connect', function() {
            log('Connected to WebSocket! SID: ' + socket.id);
            statusDiv.textContent = 'Connected';
            socket.emit('join_feed');
        });
        
        socket.on('connect_error', function(error) {
            log('Connection error: ' + error);
            statusDiv.textContent = 'Connection Error';
        });
        
        socket.on('disconnect', function(reason) {
            log('Disconnected: ' + reason);
            statusDiv.textContent = 'Disconnected';
        });
        
        socket.on('welcome', function(data) {
            log('Welcome message: ' + JSON.stringify(data));
        });
        
        socket.on('new_post', function(data) {
            log('New post received: ' + JSON.stringify(data));
        });
        
        socket.on('room_joined', function(data) {
            log('Room joined: ' + JSON.stringify(data));
        });
    </script>
</body>
</html>
