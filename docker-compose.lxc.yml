# Docker Compose configuration for LXC/Proxmox environments
# Addresses sysctl permission issues by using alternative approaches
version: '3.8'

services:
  web:
    build: .
    command: python3 run_socketio.py
    # Use bridge network instead of host to avoid sysctl issues
    networks:
      - jeet-network
    ports:
      - "5678:5678"  # Map port 5678 to host
    env_file:
      - .env
    environment:
      - USE_SOCKETIO=true
      # Override unprivileged port settings
      - FLASK_RUN_PORT=5678
    depends_on:
      db:
        condition: service_healthy
    # Add security options for LXC compatibility
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    # Add capabilities that might be needed in LXC
    cap_add:
      - NET_BIND_SERVICE
    # Use sysctl workaround at container level
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5678/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  db:
    image: postgres:15
    networks:
      - jeet-network
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: jeetsocial
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Add security options for LXC compatibility
    security_opt:
      - apparmor:unconfined
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  jeet-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  pgdata: