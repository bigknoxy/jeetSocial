# Docker Compose configuration with SQLite - avoids PostgreSQL complications in LXC
# Best option for restricted LXC environments
version: '3.8'

services:
  web:
    build: .
    command: python3 run_socketio.py
    # Use host networking to avoid sysctl issues
    network_mode: host
    # Run as root to avoid permission issues in LXC
    user: "0:0"
    privileged: true
    env_file:
      - .env
    environment:
      - USE_SOCKETIO=true
      # Force SQLite usage
      - DATABASE_URL=sqlite:///jeetsocial.db
    # Add security options for LXC compatibility
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    # Mount volume for SQLite database persistence
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5678/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped